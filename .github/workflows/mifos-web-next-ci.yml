name: mifos-web-next CI

on:
  push:
    paths:
      - 'mifos-web-next/**'
      - '.github/workflows/mifos-web-next-ci.yml'
  pull_request:
    paths:
      - 'mifos-web-next/**'
      - '.github/workflows/mifos-web-next-ci.yml'

defaults:
  run:
    working-directory: mifos-web-next

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: mifos-web-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
